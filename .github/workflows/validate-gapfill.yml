name: Validate bike hire gap recovery
on:
  push:
    paths:
      - 'gapfill_validation.py'
      - '.github/workflows/validate-gapfill.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python gapfill_validation.py
